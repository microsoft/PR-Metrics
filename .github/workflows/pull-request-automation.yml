---
name: Pull Request Automation

on:
  schedule:
    - cron: 2-57/5 * * * *
  workflow_dispatch: null

permissions: {}

concurrency:
  group: pull-request-automation
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

# Restrict the production environment to main. Do not allow refs/pull/*/merge.
# PR refs are fetched as data, never checked out or executed.
jobs:
  automate:
    if: github.ref == 'refs/heads/main'
    name: Pull Request Automation
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Trusted Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: App Token – Mint
        id: app-token
        uses: microsoft/PR-Metrics/.github/actions/mint-github-app-token@ac92804a3a0c8b711ca02dd9956ac6a7f2a1d2ca # v1.7.18
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"pull_requests":"write"}'

      - name: Update Open Pull Requests
        run: .github/workflow-scripts/Invoke-PullRequestAutomation.ps1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_METRICS_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_FILE-MATCHING-PATTERNS: |
            **/*
            !dist/*
            !package-lock.json
