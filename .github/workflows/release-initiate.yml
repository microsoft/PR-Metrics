---
name: Release – Initiate

on:
  workflow_dispatch: null

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  dependencies:
    if: github.ref == 'refs/heads/main'
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: release-dependencies-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: npm – Install Dependencies
        run: npm ci

      - name: npm – Update Package Versions
        run: npm run update:versions

      - name: npm – Update Transitive Dependencies
        run: npm run update:dependencies

      - name: Upload Dependency Manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependencies-${{ github.run_attempt }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main'
    name: Release
    needs: dependencies
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Trusted Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions

      - name: App Token – Mint
        id: app-token
        uses: ./.github/actions/mint-github-app-token # zizmor: ignore[self-repository]
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"contents":"write","pull_requests":"write"}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: Download Dependency Manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dependencies.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-dependencies

      # Only promote manifests, never executable files from the dependency job.
      - name: Apply Dependency Manifests
        run: |-
          foreach ($file in @('package.json', 'package-lock.json'))
          {
              Copy-Item -LiteralPath (Join-Path -Path $env:DEPENDENCY_DIRECTORY -ChildPath $file) -Destination $file
          }
        env:
          DEPENDENCY_DIRECTORY: ${{ runner.temp }}/release-dependencies

      - name: Version Number – Read
        run: |-
          $release = Get-Content -Path '.github/release-version.json' -Raw | ConvertFrom-Json
          $major = [int] $release.major
          $minor = [int] $release.minor
          $patch = [int] $release.patch
          "major=$major" >> $Env:GITHUB_ENV
          "minor=$minor" >> $Env:GITHUB_ENV
          "patch=$patch" >> $Env:GITHUB_ENV
          "version=$major.$minor.$patch" >> $Env:GITHUB_ENV

      - name: Version Number – Update
        run: >-
          .github/workflow-scripts/Update-Version.ps1
          -Major $env:major
          -Minor $env:minor
          -Patch $env:patch

      - name: Version Number – release-publish-trigger.txt
        run: Set-Content -Path '.github/release-publish-trigger.txt' -Value $env:version

      - name: Git – Create Branch
        run: git checkout -b release/v$env:version

      # stage-all-files replaces a separate git add. create-branch-on-remote
      # pushes the new branch before the signed GraphQL commit is created.
      - name: Git – Commit & Push (Signed)
        uses: grafana/github-api-commit-action@b1d81091e8480dd11fcea8bc1f0ab977a0376ca5 # v1.0.0
        with:
          commit-message: "feat: release v${{ env.version }}"
          create-branch-on-remote: true
          stage-all-files: true
          token: ${{ steps.app-token.outputs.token }}

      # The API commit updates the remote only. Sync it locally before creating
      # the release PR.
      - name: Git – Sync Local with Remote
        run: |-
          git fetch origin release/v$env:version
          git reset --hard origin/release/v$env:version

      - name: PR – Create
        run: >-
          gh pr create
          --title "[Autogenerated] Release v$env:version with Package Updates"
          --body "Autogenerated release for PR Metrics v$env:version. This includes version updates and dependency updates."
          --label "release"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
