---
name: Copilot Org Billing Test

on:
  push:
    branches:
      - test/copilot-org-billing
    paths:
      - .github/workflows/test-copilot-org-billing.yml

permissions: {}

jobs:
  billing:
    if: github.repository == 'microsoft/PR-Metrics' && github.ref == 'refs/heads/test/copilot-org-billing'
    name: Test Organization-Billed Inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: Install Copilot CLI
        run: npm install --global --no-audit --no-fund @github/copilot@1.0.105

      - name: Test Native Organization Billing
        id: inference
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot \
            --prompt 'Do not use tools. Reply with exactly ORG_BILLING_OK and nothing else.' \
            --model auto \
            --silent \
            --no-color \
            --no-auto-update \
            --no-custom-instructions \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools \
            --trust-folder \
            | tee copilot-org-billing-response.txt

          if [[ "$(cat copilot-org-billing-response.txt)" != 'ORG_BILLING_OK' ]]; then
            echo '::error::Copilot did not return the expected billing test response.'
            exit 1
          fi

          printf '%s\n' \
            '## Organization billing test passed' \
            'Copilot returned the expected response using the native workflow GITHUB_TOKEN.' \
            'No personal token, production credentials, or repository writes were used.' \
            'This confirms inference access, not release pull request publishing.' \
            >> "$GITHUB_STEP_SUMMARY"
