---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 9 * * 1
  workflow_dispatch: null

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  pr-metrics:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: PR Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: npm – Install Dependencies
        run: npm ci

      - name: npm – Build Candidate
        run: npm run build:package:no-install

      - name: PR Metrics
        # Run the candidate package built in this checkout.
        run: node dist/index.mjs
        env:
          PR_METRICS_ACCESS_TOKEN: ${{ github.token }}
          INPUT_FILE-MATCHING-PATTERNS: |
            **/*
            !dist/*
            !package-lock.json

  update-code:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Update Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes-present: ${{ steps.git-test-for-changes.outputs.CHANGES_PRESENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - if: github.event_name == 'pull_request'
        name: Git – Fetch Pull Request Merge Ref
        run: git fetch --no-tags origin "+$env:GITHUB_REF`:$env:GITHUB_REF"

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: npm – Install Dependencies
        run: npm ci

      - name: License – Truncate
        run: .github/workflow-scripts/Update-Licenses.ps1

      - name: License – Generate Third-Party Licenses
        run: npx generate-license-file --input package.json --output third-party-licenses.txt --overwrite --eol lf --ci --no-spinner

      - name: License – Update LICENSE.txt
        run: .github/workflow-scripts/Update-ThirdPartyNotices.ps1

      - name: npm – Lint
        run: npm run lint

      - name: npm – Build Package
        run: npm run build:package:no-install

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          FILTER_REGEX_EXCLUDE: .*(dist/|\.github/workflows/.*\.lock\.yml).*
          FIX_JSON_PRETTIER: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_MARKDOWN: true
          FIX_NATURAL_LANGUAGE: true
          FIX_TYPESCRIPT_PRETTIER: true
          FIX_YAML_PRETTIER: true
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_FILE: gitleaks.toml
          MARKDOWN_CONFIG_FILE: ../../.markdownlint.json
          MULTI_STATUS: false
          SAVE_SUPER_LINTER_SUMMARY: false
          SPELL_CODESPELL_CONFIG_FILE: .codespellrc
          # Disable linters that conflict with other linters or are not enforced.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_JSON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_TYPESCRIPT_ES: false

      - name: Git – Create Changes Patch
        id: git-test-for-changes
        run: .github/workflow-scripts/New-GeneratedChangesPatch.ps1

      - if: github.event_name == 'pull_request'
        name: Git – Upload Changes Patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-changes-v2-${{ github.run_attempt }}
          if-no-files-found: error
          path: generated/generated-changes.patch
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Agentic Workflow – Verify
        shell: bash
        run: |
          gh extension install github/gh-aw --pin v1.0.1
          gh aw compile update-ci-dependencies --validate --no-check-update
          git diff --exit-code -- .github/workflows/update-ci-dependencies.lock.yml .github/aw/actions-lock.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Workflow Lockfile – Verify
        run: gh extension install github/gh-actions-lock --pin v0.4.0 && gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: npm – Install Dependencies
        run: npm ci

      - name: npm – Lint
        run: npm run lint -- --no-fix

      - name: npm – Build
        run: npm run build:no-install

      - name: npm – Test
        run: npm run test:no-install

      - name: Release – Create
        run: npx tfx-cli extension create --manifest-globs vss-extension.json --output-path ../ms-omex.PRMetrics.vsix
        working-directory: ${{ github.workspace }}/release

      - name: Release – Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PRMetrics
          path: ${{ github.workspace }}/ms-omex.PRMetrics.vsix

  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL – Initialize
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          build-mode: none
          config-file: .github/linters/codeql.yml
          languages: javascript-typescript
          queries: code-quality,code-scanning,security-and-quality,security-experimental,security-extended

      - name: CodeQL – Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: TypeScript

  validate-linter:
    name: Validate – Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          FILTER_REGEX_EXCLUDE: .*(dist/|\.github/workflows/.*\.lock\.yml).*
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_FILE: gitleaks.toml
          MARKDOWN_CONFIG_FILE: ../../.markdownlint.json
          MULTI_STATUS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          SAVE_SUPER_LINTER_SUMMARY: false
          SPELL_CODESPELL_CONFIG_FILE: .codespellrc
          # Disable linters that conflict with other linters or are not enforced.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_JSON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_TYPESCRIPT_ES: false
