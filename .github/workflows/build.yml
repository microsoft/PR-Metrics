---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 9 * * 1
  workflow_dispatch: null

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  pr-metrics:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: PR Metrics
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: App Token – Mint
        id: app-token
        uses: microsoft/PR-Metrics/.github/actions/mint-github-app-token@0959437740572519916a08b3609e67ffa435f8dd # v1.7.17
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"pull_requests":"write"}'

      - name: PR Metrics
        uses: microsoft/PR-Metrics@0959437740572519916a08b3609e67ffa435f8dd # v1.7.17
        env:
          PR_METRICS_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          file-matching-patterns: |
            **/*
            !dist/*
            !package-lock.json

  update-code:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Update Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes-present: ${{ steps.git-test-for-changes.outputs.CHANGES_PRESENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: npm – Install Dependencies
        run: npm ci

      - name: License – Truncate
        run: .github/workflow-scripts/Update-Licenses.ps1

      - name: License – Generate Third-Party Licenses
        run: npx generate-license-file --input package.json --output third-party-licenses.txt --overwrite --eol lf --ci --no-spinner

      - name: License – Update LICENSE.txt
        run: .github/workflow-scripts/Update-ThirdPartyNotices.ps1

      - name: npm – Lint
        run: npm run lint

      - name: npm – Build Package
        run: npm run build:package

      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          FILTER_REGEX_EXCLUDE: .*dist/.*
          FIX_JSON_PRETTIER: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_MARKDOWN: true
          FIX_NATURAL_LANGUAGE: true
          FIX_TYPESCRIPT_PRETTIER: true
          FIX_YAML_PRETTIER: true
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_FILE: gitleaks.toml
          MARKDOWN_CONFIG_FILE: ../../.markdownlint.json
          MULTI_STATUS: false
          SAVE_SUPER_LINTER_SUMMARY: true
          SPELL_CODESPELL_CONFIG_FILE: .codespellrc
          # Disable linters that conflict with other linters or are not enforced.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_JSON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_TYPESCRIPT_ES: false

      - name: Git – Create Changes Patch
        id: git-test-for-changes
        run: |-
          git add -A
          $changesPresent = [bool](git diff --cached --name-only)
          "CHANGES_PRESENT=$($changesPresent.ToString())" >> $Env:GITHUB_OUTPUT
          if ($changesPresent)
          {
              New-Item -ItemType Directory -Path 'generated' | Out-Null
              git diff --cached --binary --output='generated/generated-changes.patch'
          }

      - if: github.event_name == 'pull_request' && steps.git-test-for-changes.outputs.CHANGES_PRESENT == 'True'
        name: Git – Upload Changes Patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-changes
          if-no-files-found: error
          path: generated/generated-changes.patch
          retention-days: 1

  commit-changes:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.update-code.outputs.changes-present == 'True'
    name: Commit Changes
    needs: update-code
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Git – Create Local Branch
        run: git switch --create "$env:HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

      - name: Git – Download Changes Patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-changes
          path: ${{ runner.temp }}/generated-changes

      - name: Git – Apply Changes Patch
        run: git apply --index '${{ runner.temp }}/generated-changes/generated-changes.patch'

      - name: Git – Verify Pull Request Head
        run: |-
          $remoteHead = (git ls-remote origin "refs/heads/$env:HEAD_REF").Split()[0]
          if ($remoteHead -ne $env:EXPECTED_HEAD)
          {
              throw "The pull request branch changed from '$env:EXPECTED_HEAD' to '$remoteHead'. Re-run the workflow before committing generated changes."
          }
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}

      - name: App Token – Mint
        id: app-token
        uses: microsoft/PR-Metrics/.github/actions/mint-github-app-token@0959437740572519916a08b3609e67ffa435f8dd # v1.7.17
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"contents":"write"}'

      - name: Git – Commit & Push (Signed)
        run: |-
          $additions = [System.Collections.Generic.List[object]]::new()
          $deletions = [System.Collections.Generic.List[object]]::new()

          foreach ($change in git diff --cached --no-renames --name-status)
          {
              $status, $path = $change -split "`t", 2
              switch ($status)
              {
                  'A'
                  {
                      $additions.Add(@{
                          path = $path
                          contents = [System.Convert]::ToBase64String(
                              [System.IO.File]::ReadAllBytes($path)
                          )
                      })
                  }
                  'M'
                  {
                      $additions.Add(@{
                          path = $path
                          contents = [System.Convert]::ToBase64String(
                              [System.IO.File]::ReadAllBytes($path)
                          )
                      })
                  }
                  'D'
                  {
                      $deletions.Add(@{ path = $path })
                  }
                  default
                  {
                      throw "Unsupported staged change '$status' for '$path'."
                  }
              }
          }

          $payload = @{
              query = @'
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit {
                url
              }
            }
          }
          '@
              variables = @{
                  input = @{
                      branch = @{
                          repositoryNameWithOwner = $env:GITHUB_REPOSITORY
                          branchName = $env:HEAD_REF
                      }
                      message = @{
                          headline = 'chore: fix linting, update dist folder'
                      }
                      expectedHeadOid = $env:EXPECTED_HEAD
                      fileChanges = @{
                          additions = $additions
                          deletions = $deletions
                      }
                  }
              }
          } | ConvertTo-Json -Compress -Depth 10

          $payload | gh api graphql --input -
          if ($LASTEXITCODE -ne 0)
          {
              throw "Could not commit generated changes to '$env:HEAD_REF'."
          }
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: npm – Install Dependencies
        run: npm ci

      - name: npm – Lint
        run: npm run lint -- --no-fix

      - name: npm – Clean
        run: npm run clean

      - name: npm – Build
        run: npm run build

      - name: npm – Test
        run: npm run test

      - name: Release – Create
        run: npx tfx-cli extension create --manifest-globs vss-extension.json --output-path ../ms-omex.PRMetrics.vsix
        working-directory: ${{ github.workspace }}/release

      - name: Release – Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRMetrics
          path: ${{ github.workspace }}/ms-omex.PRMetrics.vsix

  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL – Initialize
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: none
          config-file: .github/linters/codeql.yml
          languages: javascript-typescript
          queries: code-quality,code-scanning,security-and-quality,security-experimental,security-extended

      - name: CodeQL – Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: TypeScript

  dependabot:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Dependabot
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: gh – Log Version
        run: gh --version

      - name: App Token – Mint
        id: app-token
        uses: microsoft/PR-Metrics/.github/actions/mint-github-app-token@0959437740572519916a08b3609e67ffa435f8dd # v1.7.17
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"pull_requests":"write"}'

      - name: Auto-Approve
        run: gh pr review --approve "$env:PR_URL"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
