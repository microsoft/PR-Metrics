---
parameters:
  - name: production
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: Build
    ${{ if parameters.production }}:
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Prerequisites
        displayName: Prerequisites
        ${{ if not(parameters.production) }}:
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
            os: linux
            image: ubuntu-latest
          steps:
            - checkout: self
              displayName: Checkout
              persistCredentials: false

            - task: UseNode@1
              displayName: Install Node.js
              inputs:
                version: 24.13.0

            - task: Npm@1
              displayName: npm – Install Dependencies
              inputs:
                command: ci

            - task: Npm@1
              displayName: npm – Lint
              inputs:
                command: custom
                customCommand: run lint -- --no-fix

            - task: Npm@1
              displayName: npm – Build
              inputs:
                command: custom
                customCommand: run build
        ${{ else }}:
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
            os: linux
            image: ubuntu-latest
          variables:
            - group: PR Metrics
          steps:
            - checkout: self
              displayName: Checkout
              persistCredentials: false

            - task: UseNode@1
              displayName: Install Node.js
              inputs:
                version: 24.13.0

            - bash: |
                {
                  echo "ignore-scripts=true"
                  echo "registry=https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/"
                  echo "always-auth=true"
                } > "$(Build.SourcesDirectory)/.npmrc"
              displayName: npm – Point at Office Feed

            - task: npmAuthenticate@0
              displayName: npm – Authenticate
              inputs:
                workingFile: $(Build.SourcesDirectory)/.npmrc

            - task: Npm@1
              displayName: npm – Install Dependencies
              inputs:
                command: ci

            - task: Npm@1
              displayName: npm – Build Release
              inputs:
                command: custom
                customCommand: run build:release

            - task: AzureCLI@3
              displayName: Azure DevOps – Sign-in
              inputs:
                connectionType: azureRM
                azureSubscription: PR Metrics
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $AccessToken = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
                  npx tfx login --service-url https://dev.azure.com/$($env:ADOACCOUNT) --token $AccessToken
              env:
                ADOACCOUNT: $(ADOACCOUNT)

            - bash: npx tfx build tasks delete --task-id 907d3b28-6b37-4ac7-ac75-9631ee53e512 --no-prompt
              displayName: Azure DevOps – Delete Old Task
              continueOnError: true

            - bash: npx tfx build tasks upload --task-path release/task --no-prompt
              displayName: Azure DevOps – Deploy

      - job: PRMetrics_Ubuntu
        displayName: PR Metrics – Ubuntu
        dependsOn: Prerequisites
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: linux
          image: ubuntu-latest
        ${{ if parameters.production }}:
          variables:
            - group: PR Metrics
          steps:
            - template: production-pr-metrics-steps.yml
        ${{ else }}:
          steps:
            - template: test-steps.yml

      - job: PRMetrics_Windows
        displayName: PR Metrics – Windows
        dependsOn: PRMetrics_Ubuntu
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        ${{ if parameters.production }}:
          variables:
            - group: PR Metrics
          steps:
            - template: production-pr-metrics-steps.yml
        ${{ else }}:
          steps:
            - template: test-steps.yml

      - job: Validation
        displayName: Validation
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        steps:
          - task: ComponentGovernanceComponentDetection@0
            displayName: Component Detection

          - task: PoliCheck@2
            displayName: PoliCheck
            inputs:
              targetType: F
              optionsFC: 1
              optionsUEPATH: $(Build.SourcesDirectory)/.github/azure-devops/PoliCheckExclusions.xml

          - task: PublishSecurityAnalysisLogs@3
            displayName: Guardian – Publish Artifacts

          - task: PostAnalysis@2
            displayName: Guardian – Perform Analysis
            inputs:
              GdnBreakPolicyMinSev: Note
              GdnBreakGdnToolGosecSeverity: Default
              GdnBreakPolicy: M365
