---
trigger: none

pr:
  branches:
    include:
      - main

variables:
  - name: tags
    value: multi-phased

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/Office.Unofficial.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    featureFlags:
      scanAllEslintScriptExtensions: true
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
        os: windows
        image: windows-latest
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\.github\azure-devops\CredScanSuppressions.json
      eslint:
        enabled: true
        useV3: true
        targetsESLint: src/task/**/*.ts
        break: true
        severity: Error
        enableExclusions: true
        exclusionPatterns: |
          **/*.js
    stages:
      - template: template.yml
