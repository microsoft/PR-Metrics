---
# This template is reachable from the pull request pipelines, which build code
# from untrusted branches and forks. It must therefore remain free of standing
# credentials: no variable groups, service connections, GitHub App tokens, key
# vaults, package feed tokens or Azure DevOps task deployments belong here.
# Privileged operations live in template.yml, which is only reachable from
# prod.yml.
#
# Dependencies are restored anonymously. Every resolved URL within
# package-lock.json is pinned to the anonymous 1ES public npm mirror at
# ms-feed-2, ms-feed-12 and ms-feed-25 under 1es-public/_packaging/npm-public,
# which the network isolation policy (CFSClean) approves, and each package
# carries an integrity hash. No credential is therefore created, injected or
# destroyed anywhere within the pull request graph:
#
#   1. '--replace-registry-host=never' fetches each package from the exact URL
#      recorded in the lockfile, so no registry configuration, including one a
#      pull request adds to .npmrc, can redirect the restore elsewhere.
#   2. '--no-audit' prevents npm from contacting the audit endpoint, which is
#      the only other host a restore would otherwise reach.
#   3. '--ignore-scripts' prevents pull request controlled package.json scripts
#      from executing during the restore.
#   4. Each package is verified against the lockfile integrity hash, so a
#      compromised mirror cannot substitute different content.
#
# Only scripts that do not reinstall dependencies are invoked afterwards, so no
# nested restore can reach an unpinned registry.

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Prerequisites
        displayName: Prerequisites
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: linux
          image: ubuntu-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - script: npm ci --ignore-scripts --no-audit --replace-registry-host=never
            displayName: npm – Restore Dependencies

          - script: npm run lint
            displayName: npm – Lint

      - job: PRMetrics_Ubuntu
        displayName: PR Metrics – Ubuntu
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: linux
          image: ubuntu-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - script: npm ci --ignore-scripts --no-audit --replace-registry-host=never
            displayName: npm – Restore Dependencies

          - script: npm run test:fast
            displayName: npm – Test

      - job: PRMetrics_Windows
        displayName: PR Metrics – Windows
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - script: npm ci --ignore-scripts --no-audit --replace-registry-host=never
            displayName: npm – Restore Dependencies

          - script: npm run test:fast
            displayName: npm – Test

      - job: Validation
        displayName: Validation
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: ComponentGovernanceComponentDetection@0
            displayName: Component Detection

          - task: PoliCheck@2
            displayName: PoliCheck
            inputs:
              targetType: F
              optionsFC: 1
              optionsUEPATH: $(Build.SourcesDirectory)/.github/azure-devops/PoliCheckExclusions.xml

          - task: PublishSecurityAnalysisLogs@3
            displayName: Guardian – Publish Artifacts

          - task: PostAnalysis@2
            displayName: Guardian – Perform Analysis
            inputs:
              GdnBreakPolicyMinSev: Note
              GdnBreakGdnToolGosecSeverity: Default
              GdnBreakPolicy: M365
