---
# This template is reachable from the pull request pipelines, which build code
# from untrusted branches and forks. It must therefore remain free of standing
# credentials: no variable groups, service connections, GitHub App tokens, key
# vaults or Azure DevOps task deployments belong here. Privileged operations
# live in template.yml, which is only reachable from prod.yml.
#
# The single exception is the dependency restore, which the network isolation
# policy (CFSClean) requires to flow through the approved Office Azure
# Artifacts feed rather than the public registry. That restore is fenced into
# the narrowest possible window:
#
#   1. A temporary npm configuration is generated by this YAML under
#      $(Agent.TempDirectory), never inside the checkout, so no credential is
#      written to a location a pull request can read back through the
#      repository.
#   2. npmAuthenticate@0 injects a path scoped '//<feed>/:_authToken' entry for
#      the approved feed alone, using the build identity rather than a service
#      connection, so the credential cannot be replayed against another host.
#   3. Only 'npm ci --ignore-scripts' runs while that credential exists, so no
#      pull request controlled package.json script executes.
#   4. The temporary configuration is deleted immediately afterwards by a step
#      that runs on every outcome.
#
# Every step that executes pull request controlled code therefore runs after
# the credential has been destroyed, and only scripts that do not reinstall
# dependencies are invoked, so no nested 'npm ci' can resurrect the feed.

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Prerequisites
        displayName: Prerequisites
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: linux
          image: ubuntu-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - pwsh: |
              New-Item -ItemType Directory -Force -Path '$(Agent.TempDirectory)/npm-restore' | Out-Null
              Set-Content -Path '$(Agent.TempDirectory)/npm-restore/.npmrc' -Value @(
                'ignore-scripts=true',
                'registry=https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/'
              )
            displayName: npm – Create Temporary Configuration

          - task: npmAuthenticate@0
            displayName: npm – Authenticate Temporary Configuration
            inputs:
              workingFile: $(Agent.TempDirectory)/npm-restore/.npmrc

          - script: |-
              npm ci --ignore-scripts --no-audit --userconfig $(Agent.TempDirectory)/npm-restore/.npmrc --registry https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/
            displayName: npm – Restore Dependencies

          - pwsh: |
              Remove-Item -Path '$(Agent.TempDirectory)/npm-restore' -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path -Path '$(Agent.TempDirectory)/npm-restore') {
                throw 'The temporary npm configuration could not be deleted.'
              }
            displayName: npm – Delete Temporary Configuration
            condition: always()

          - script: npm run lint
            displayName: npm – Lint

      - job: PRMetrics_Ubuntu
        displayName: PR Metrics – Ubuntu
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: linux
          image: ubuntu-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - pwsh: |
              New-Item -ItemType Directory -Force -Path '$(Agent.TempDirectory)/npm-restore' | Out-Null
              Set-Content -Path '$(Agent.TempDirectory)/npm-restore/.npmrc' -Value @(
                'ignore-scripts=true',
                'registry=https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/'
              )
            displayName: npm – Create Temporary Configuration

          - task: npmAuthenticate@0
            displayName: npm – Authenticate Temporary Configuration
            inputs:
              workingFile: $(Agent.TempDirectory)/npm-restore/.npmrc

          - script: |-
              npm ci --ignore-scripts --no-audit --userconfig $(Agent.TempDirectory)/npm-restore/.npmrc --registry https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/
            displayName: npm – Restore Dependencies

          - pwsh: |
              Remove-Item -Path '$(Agent.TempDirectory)/npm-restore' -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path -Path '$(Agent.TempDirectory)/npm-restore') {
                throw 'The temporary npm configuration could not be deleted.'
              }
            displayName: npm – Delete Temporary Configuration
            condition: always()

          - script: npm run test:fast
            displayName: npm – Test

      - job: PRMetrics_Windows
        displayName: PR Metrics – Windows
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.13.0

          - pwsh: |
              New-Item -ItemType Directory -Force -Path '$(Agent.TempDirectory)/npm-restore' | Out-Null
              Set-Content -Path '$(Agent.TempDirectory)/npm-restore/.npmrc' -Value @(
                'ignore-scripts=true',
                'registry=https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/'
              )
            displayName: npm – Create Temporary Configuration

          - task: npmAuthenticate@0
            displayName: npm – Authenticate Temporary Configuration
            inputs:
              workingFile: $(Agent.TempDirectory)/npm-restore/.npmrc

          - script: |-
              npm ci --ignore-scripts --no-audit --userconfig $(Agent.TempDirectory)/npm-restore/.npmrc --registry https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/
            displayName: npm – Restore Dependencies

          - pwsh: |
              Remove-Item -Path '$(Agent.TempDirectory)/npm-restore' -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path -Path '$(Agent.TempDirectory)/npm-restore') {
                throw 'The temporary npm configuration could not be deleted.'
              }
            displayName: npm – Delete Temporary Configuration
            condition: always()

          - script: npm run test:fast
            displayName: npm – Test

      - job: Validation
        displayName: Validation
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared-StaticIP
          os: windows
          image: windows-latest
        steps:
          - checkout: self
            displayName: Checkout
            persistCredentials: false

          - task: ComponentGovernanceComponentDetection@0
            displayName: Component Detection

          - task: PoliCheck@2
            displayName: PoliCheck
            inputs:
              targetType: F
              optionsFC: 1
              optionsUEPATH: $(Build.SourcesDirectory)/.github/azure-devops/PoliCheckExclusions.xml

          - task: PublishSecurityAnalysisLogs@3
            displayName: Guardian – Publish Artifacts

          - task: PostAnalysis@2
            displayName: Guardian – Perform Analysis
            inputs:
              GdnBreakPolicyMinSev: Note
              GdnBreakGdnToolGosecSeverity: Default
              GdnBreakPolicy: M365
